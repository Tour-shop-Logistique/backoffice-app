<!doctype html>
<html lang="fr" translate="no" class="h-full bg-slate-50">

<head>
  <meta charset="UTF-8" />

  <!-- SEO & Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Tour Shop - Backoffice de gestion des expéditions et du contrôle logistique" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="google" content="notranslate" />

  <!-- Pavicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Tour Shop - Backoffice</title>
</head>

<body class="h-full font-sans antialiased text-slate-900 selection:bg-blue-100 selection:text-blue-900">
  <div id="root" class="h-full"></div>

  <!-- Portals for Modals & Notifications -->
  <div id="modal-root"></div>
  <!-- Pas de "relative z-50" ici : ce div doit rester neutre pour que le
       z-[10000] du toast (notification.jsx) s'applique par rapport à la
       racine du document, pas à un stacking context local qui le piègerait
       derrière tout élément ayant un z-index plus élevé (ex. Modal.jsx,
       z-index:9999 posé directement sur <body>). -->
  <div id="notification-root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
